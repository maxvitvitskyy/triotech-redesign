<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Triotech</title>
<meta name="robots" content="noindex">
<style>  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;
    background:#0F141A;color:#EFEDED;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .mark{width:56px;height:50px;margin:0 auto 26px;display:block}
  .code{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:#FF7E02;margin-bottom:18px;
  }
  .code::before{content:"";width:26px;height:2px;background:linear-gradient(92deg,#FF7E02,#FF2E00)}
  h1{font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-bottom:12px}
  h1 span{display:block;font-weight:300;color:#94A3B2;font-size:.6em;margin-top:10px;letter-spacing:0}
  p{color:#8592A1;font-size:15px;max-width:44ch;margin:0 auto}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px}
  a{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:54px;padding:0 30px;border-radius:6px;
    font-size:15px;font-weight:500;text-decoration:none;color:#EFEDED;
    border:1px solid rgba(239,237,237,.2);transition:.25s cubic-bezier(.22,.61,.36,1);
  }
  a.primary{background-image:linear-gradient(92deg,#FF7E02,#FF2E00);color:#fff;border-color:transparent;
    box-shadow:0 10px 26px -12px rgba(255,94,1,.85)}
  a:hover{transform:translateY(-2px);border-color:#FF7E02;color:#FF7E02}
  a.primary:hover{color:#fff;border-color:transparent}
  :focus-visible{outline:2px solid #FF7E02;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 24 22" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FF7E02"/><stop offset="100%" stop-color="#FF2E00"/>
      </linearGradient></defs>
      <polygon points="12,1.5 17.6,11 6.4,11" fill="url(#g)"/>
      <polygon points="6.4,11 12,20.5 0.8,20.5" fill="url(#g)"/>
      <polygon points="17.6,11 23.2,20.5 12,20.5" fill="url(#g)"/>
    </svg>
    <p class="code">404</p>
    <h1>Сторінку не знайдено<span>Page not found</span></h1>
    <p>Такої адреси на сайті немає. Оберіть галузь на головній сторінці.</p>
    <div class="row">
      <a class="primary" href="/">На головну</a>
      <a href="/Home/en/index.html">English</a>
    </div>
  </main>
</body>
</html>
